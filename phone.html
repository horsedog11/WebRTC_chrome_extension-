<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PV Phone Beta</title>
  <link rel="stylesheet" href="phone.css">
  <script src="dial.js" defer></script>
  <script src="phone.js" defer></script>
  <script src="pipeline.js" defer></script>
  <script src="workspace.js" defer></script>
</head>
<body>
  <main>
    <nav class="workspace-tabs" role="tablist" aria-label="PV workspace">
      <button id="tab-phone" type="button" role="tab" data-panel="phone" aria-controls="phone-panel" aria-selected="true">Phone</button>
      <button id="tab-people" type="button" role="tab" data-panel="people" aria-controls="people-panel" aria-selected="false" tabindex="-1">People</button>
      <button id="tab-clipboard" type="button" role="tab" data-panel="clipboard" aria-controls="clipboard-panel" aria-selected="false" tabindex="-1">Clipboard</button>
      <button id="tab-chat" type="button" role="tab" data-panel="chat" aria-controls="chat-panel" aria-selected="false" tabindex="-1">Chat</button>
    </nav>
    <div id="phone-panel" role="tabpanel" aria-labelledby="tab-phone">
    <header><div class="header-actions"><button id="dnd" type="button" class="dnd-button" aria-pressed="false" title="Activate DND">DND</button><button id="ring" type="button" class="ring-button" aria-label="Turn ringer off" title="Ringer on" aria-pressed="true" disabled><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 9h18c0-1-3-2-3-9ZM10 21h4"/><path class="bell-slash" d="M3 21 21 3"/></svg></button><button id="mute" type="button" class="mic-button" aria-label="Mute microphone" title="Mute microphone" aria-pressed="false" hidden disabled><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8"/><path class="mic-slash" d="M3 21 21 3"/></svg></button><button id="auto-answer" type="button" class="auto-answer-button" aria-label="Turn Auto Answer on" title="Auto Answer off" aria-pressed="false" disabled>AA</button></div><span id="extension-badge" class="badge">—</span></header>
    <p id="status" role="status" aria-live="polite">Disconnected</p>
    <div class="workflow-controls"><div class="mode-switch" role="group" aria-label="Call direction"><button id="mode-in" type="button" aria-pressed="false">In</button><button id="mode-out" type="button" aria-pressed="true">Out</button></div><button id="ready" type="button" aria-pressed="false">Ready</button></div>
    <details open>
      <summary>Settings</summary>
      <form id="credentials" autocomplete="off">
        <label>Host<input id="sip-host" type="text" placeholder="pbx.example.com" autocomplete="off" spellcheck="false" required></label>
        <div class="identity-fields"><label>Extension<input id="sip-extension" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" required></label><label>Display Name<input id="sip-display-name" type="text" maxlength="64" autocomplete="off" required></label></div>
        <label>Password<input id="sip-secret" type="password" autocomplete="new-password" required></label>
        <button id="session" type="submit" class="session-button">Register</button>
      </form>
      <button id="authorize" type="button" disabled>Authorize</button>
      <a class="help-link" href="help.html" target="_blank" rel="noopener">WebRTC help</a>
    </details>
    <section aria-label="Dial a number">
      <label for="destination">Search / dial a number</label>
      <div class="dial-field">
        <span class="search-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></span>
        <input id="destination" type="tel" inputmode="tel" autocomplete="off">
        <button id="call" type="button" class="call-icon" aria-label="Call number" title="Call number" disabled><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path class="icon-call" d="M6.6 3.5 4.4 5.7c-.7.7-.9 1.7-.6 2.6a20 20 0 0 0 11.9 11.9c.9.3 1.9.1 2.6-.6l2.2-2.2-5-3.4-2.1 2.1a15 15 0 0 1-5.5-5.5l2.1-2.1-3.4-5Z"/><path class="icon-hangup" d="M3 15c5.3-4.7 12.7-4.7 18 0l-2.4 3.4-3.1-1.6v-2.2a13 13 0 0 0-7 0v2.2l-3.1 1.6L3 15Z"/></svg></button>
      </div>
      <details id="keypad-panel"><summary>Keypad</summary>
        <div class="keypad-actions">
          <label for="transfer-target">Transfer to</label>
          <input id="transfer-target" type="tel" inputmode="tel" autocomplete="off" placeholder="Extension or number">
          <div class="row"><button id="transfer" type="button" disabled>Transfer</button><button id="park" type="button" title="Park at PBX extension 70" disabled>Park</button></div>
        </div>
        <div class="keypad" aria-label="Dial keypad">
          <button type="button" data-tone="1">1</button><button type="button" data-tone="2">2</button><button type="button" data-tone="3">3</button>
          <button type="button" data-tone="4">4</button><button type="button" data-tone="5">5</button><button type="button" data-tone="6">6</button>
          <button type="button" data-tone="7">7</button><button type="button" data-tone="8">8</button><button type="button" data-tone="9">9</button>
          <button type="button" data-tone="*">*</button><button type="button" data-tone="0">0</button><button type="button" data-tone="#">#</button>
        </div>
        <button id="keypad-call" type="button" class="primary" disabled>Call number</button>
      </details>
      <div id="call-bar" hidden>
        <p id="caller">Call in progress</p>
        <button id="answer" type="button" class="primary" hidden disabled>Answer</button>
      </div>
    </section>
    </div>
    <section id="people-panel" role="tabpanel" aria-labelledby="tab-people" hidden>
      <h2>Who is Sarah?</h2>
      <form id="identity-search"><label for="identity-query">Name, email, phone or UUID</label>
      <div class="search-row"><input id="identity-query" type="search" minlength="2" maxlength="100" autocomplete="off" required placeholder="Sarah, +1…, email…"><button id="identity-search-button" type="submit">Search</button></div></form>
      <p id="identity-search-status" role="status" aria-live="polite"></p><div id="identity-results"></div>
    </section>
    <section id="clipboard-panel" role="tabpanel" aria-labelledby="tab-clipboard" hidden>
      <h2>Pipeline Clipboard</h2><p id="clipboard-empty">Right-click a SuiteCRM or Ninja record, or stage a search result.</p>
      <div id="clipboard-items"></div><button id="clipboard-clear" type="button">Clear staged contacts</button>
    </section>
    <section id="chat-panel" role="tabpanel" aria-labelledby="tab-chat" hidden>
      <h2>Rocket.Chat</h2><p>Use your existing chat login. If embedding or sign-in is blocked, open Chat in a tab.</p>
      <div class="row"><button id="chat-open" type="button">Open Chat</button><button id="chat-reload" type="button">Reload embedded chat</button></div>
      <iframe id="rocket-frame" title="Rocket.Chat" referrerpolicy="no-referrer" allow="clipboard-write"></iframe>
    </section>
    <p id="pipeline-status" role="status" aria-live="polite"></p>
    <details id="pipeline-connection"><summary>Pipeline connection</summary>
      <form id="pipeline-settings" autocomplete="off">
        <label>Lookup gateway<input id="pipeline-gateway" type="url" required></label>
        <label>Read-only user session token<input id="pipeline-token" type="password" autocomplete="new-password" placeholder="Session only; never saved to disk"></label>
        <button type="submit">Connect Pipeline</button><button id="pipeline-disconnect" type="button">Disconnect Pipeline</button>
      </form><p id="pipeline-settings-status" role="status"></p>
    </details>
  </main>
</body>
</html>
